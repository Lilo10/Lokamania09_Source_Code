# Tells Railway which language and version to build with, instead of letting it
# guess. Without this, the Python version can drift when Railway updates its
# defaults, and the build can fail for reasons that have nothing to do with our
# code. Pinning it keeps builds reproducible.
[phases.setup]
providers = ["python@3.12"]

[phases.build]
# The two "ls" lines are diagnostics: they print what actually arrived so that a
# failed build says whether files are missing, instead of only reporting the
# first filename pip happens to need. Each one ends in "|| true" so a diagnostic
# can never itself be the reason the build fails.
cmds = [
  "ls -la /app || echo 'could not list /app'",
  "echo '--- application code ---'",
  "ls -la /app/server || echo 'NO server/ DIRECTORY IN THE BUILD'",
  "pip install --no-cache-dir -r requirements.txt",
]

[start]
cmd = "./start.sh"
