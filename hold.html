<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lokamania — Coming Soon</title><meta name="description" content="Lokamania is getting ready for its next edition. Contact connect@mylokamania.com."><meta name="robots" content="noindex">
<style>
:root{--ink:#03131a;--navy:#0a2733;--blue:#2fa9b8;--ice:#a8e4e8;--white:#f8fbff;--muted:#a4bec7;--line:rgba(128,192,192,.28)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--white);background:var(--ink);
background-image:radial-gradient(60% 50% at 50% 0%,rgba(47,169,184,.28),transparent 70%),radial-gradient(50% 40% at 50% 110%,rgba(168,228,232,.12),transparent 70%);
display:flex;flex-direction:column;min-height:100vh;padding:24px 16px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;max-width:640px;margin:0 auto;gap:22px}
.word{font-weight:900;letter-spacing:.32em;font-size:clamp(15px,2.4vw,18px);color:var(--ice);padding-left:.32em}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--ice);text-transform:uppercase}
h1{font-weight:900;font-size:clamp(34px,7vw,60px);line-height:1.02;letter-spacing:-.02em}
h1 span{color:var(--blue)}
p{color:var(--muted);font-size:clamp(16px,2.2vw,18px);line-height:1.6;max-width:30em}
.contact{margin-top:8px;display:flex;flex-direction:column;align-items:center;gap:10px}
.contact small{color:var(--muted);font-size:13px;letter-spacing:.04em}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--white);color:var(--ink);text-decoration:none;font-weight:800;font-size:17px;padding:15px 24px;border-radius:999px;box-shadow:0 14px 40px rgba(47,169,184,.25)}
.btn svg{width:18px;height:18px}
footer{text-align:center;color:var(--muted);font-size:12px;opacity:.7;padding-top:24px}
</style></head><body>
<main>
<div class="word">LOKAMANIA</div>
<span class="pill">Website on hold</span>
<h1>Something new<br>is <span>on its way.</span></h1>
<p>We're building the next edition of Lokamania. The website is paused while we get everything ready. See you soon.</p>
<div class="contact"><small>Brands, partners &amp; questions</small>
<a class="btn" href="mailto:connect@mylokamania.com"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>connect@mylokamania.com</a></div>
</main>
<footer>© Lokamania · mylokamania.com</footer>
</body></html>
